<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>画音共鳴 - 深海音響水槽 (16:9)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap');
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      touch-action: none; /* スマホの引っ張り更新やスクロールを固定 */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
      background-color: #030712;
      font-family: 'Zen Kaku Gothic New', sans-serif;
    }

    .glow-effect {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.2);
    }
    
    .glass-panel {
      background: rgba(10, 25, 47, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    #drawCanvas {
      cursor: crosshair;
      touch-action: none; /* 指描画時の画面ズレを確実に遮断 */
    }
  </style>
</head>
<body class="w-screen h-screen relative bg-slate-950 text-slate-100 flex flex-col justify-between overflow-hidden">

  <!-- オーディオ有効化用の最前面モーダル -->
  <div id="audioStartModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md cursor-pointer">
    <div class="glass-panel p-6 md:p-8 rounded-3xl max-w-md w-full text-center border border-cyan-500/40 shadow-2xl">
      <div class="w-14 h-14 md:w-16 md:h-16 mx-auto mb-4 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-300 text-2xl animate-pulse">
        <i class="fa-solid fa-volume-high"></i>
      </div>
      <h2 class="text-xl md:text-2xl font-bold mb-2 text-cyan-100">音響空間を開始</h2>
      <p class="text-xs md:text-sm text-slate-300 mb-6">
        画面のどこでもタップ／クリックすると水槽に入ります。<br>衝突音や泡が弾ける音が響きます。
      </p>
      <button id="startAudioBtn" class="w-full py-3.5 md:py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-2xl shadow-lg transition-all duration-300 transform hover:scale-105 active:scale-95 glow-effect cursor-pointer text-sm md:text-base">
        水槽に入る（音声を有効化）
      </button>
    </div>
  </div>

  <!-- メイン水槽スクリーン (ワールドビュー) -->
  <div id="canvasContainer" class="absolute inset-0 w-full h-full overflow-hidden bg-slate-950 flex items-center justify-center">
    <canvas id="aquariumCanvas" class="block"></canvas>
  </div>

  <!-- UIオーバーレイ: ヘッダー（右上のステータス表示のみ配置） -->
  <header class="relative z-10 p-3 md:p-6 pointer-events-none flex justify-end items-start w-full">
    <div class="glass-panel px-3 py-1.5 md:px-4 md:py-2 rounded-xl pointer-events-auto text-[10px] md:text-xs flex gap-2 md:gap-4 text-cyan-200/80">
      <div><i class="fa-solid fa-fish text-cyan-400 mr-1"></i> 生物数: <span id="creatureCount" class="font-bold text-white">0</span></div>
      <div><i class="fa-solid fa-expand text-teal-400 mr-1"></i> 拡大率: <span id="zoomLevel" class="font-bold text-white">100%</span></div>
      <div><i class="fa-solid fa-[#38bdf8] fa-circle-dot text-indigo-400 mr-1"></i> 泡数: <span id="bubbleCount" class="font-bold text-white">0</span></div>
    </div>
  </header>

  <!-- UIオーバーレイ: お絵描きパレット & コントロール -->
  <footer class="relative z-10 p-3 md:p-6 pointer-events-none flex flex-col md:flex-row justify-between items-end gap-3 w-full">
    
    <!-- 左下: 音階スケール設定 -->
    <div class="glass-panel p-3 md:p-4 rounded-2xl pointer-events-auto w-full md:w-auto flex flex-col gap-1.5 md:gap-2">
      <div class="text-[10px] md:text-xs text-cyan-300/80 font-bold flex items-center gap-1">
        <i class="fa-solid fa-sliders"></i> 音階スケール設定
      </div>
      <div class="flex gap-1.5 md:gap-2">
        <button id="scalePentatonic" class="flex-1 md:flex-none px-2.5 py-1.5 rounded-lg text-[10px] md:text-xs bg-cyan-500/30 border border-cyan-400 text-cyan-100 font-medium">ペンタトニック</button>
        <button id="scaleLydian" class="flex-1 md:flex-none px-2.5 py-1.5 rounded-lg text-[10px] md:text-xs bg-slate-800/60 border border-slate-700 text-slate-400 font-medium hover:bg-slate-700/50">リディアン</button>
        <button id="scaleOkinawa" class="flex-1 md:flex-none px-2.5 py-1.5 rounded-lg text-[10px] md:text-xs bg-slate-800/60 border border-slate-700 text-slate-400 font-medium hover:bg-slate-700/50">琉球</button>
      </div>
    </div>

    <!-- 右下: お絵描きパレット -->
    <div class="glass-panel p-3 md:p-4 rounded-3xl pointer-events-auto flex flex-col gap-2.5 md:gap-3 w-full md:w-96 shadow-2xl">
      <div class="flex justify-between items-center">
        <span class="text-[11px] md:text-xs font-bold text-cyan-200 flex items-center gap-1.5">
          <i class="fa-solid fa-pen-nib text-cyan-400"></i> 生き物を描く
        </span>
        <div class="flex gap-2 items-center">
          <button id="openPopoutBtn" class="text-[10px] md:text-xs bg-cyan-500/20 hover:bg-cyan-500/40 text-cyan-300 px-2 py-1 rounded-lg border border-cyan-500/40 transition-colors flex items-center gap-1">
            <i class="fa-solid fa-up-right-from-square"></i> 別ウィンドウ
          </button>
          <button id="clearDrawBtn" class="text-[10px] md:text-xs text-slate-400 hover:text-rose-400 transition-colors">
            <i class="fa-solid fa-trash-can"></i> クリア
          </button>
        </div>
      </div>

      <!-- 描画キャンバス領域 -->
      <div class="relative w-full h-32 md:h-44 bg-slate-900/90 rounded-2xl border border-cyan-500/30 overflow-hidden shadow-inner">
        <canvas id="drawCanvas" class="w-full h-full block"></canvas>
        <div id="drawPlaceholder" class="absolute inset-0 flex items-center justify-center pointer-events-none text-slate-500 text-[10px] md:text-xs">
          ここに自由に線を描いてください
        </div>
      </div>

      <!-- 筆の設定 & アクション -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1 bg-slate-900/60 p-1 md:p-1.5 rounded-xl border border-slate-800">
          <button class="color-btn w-5 h-5 md:w-6 md:h-6 rounded-full bg-cyan-400 border-2 border-white scale-110" data-color="#22d3ee"></button>
          <button class="color-btn w-5 h-5 md:w-6 md:h-6 rounded-full bg-emerald-400 border-2 border-transparent" data-color="#34d399"></button>
          <button class="color-btn w-5 h-5 md:w-6 md:h-6 rounded-full bg-indigo-400 border-2 border-transparent" data-color="#818cf8"></button>
          <button class="color-btn w-5 h-5 md:w-6 md:h-6 rounded-full bg-purple-400 border-2 border-transparent" data-color="#c084fc"></button>
          <button class="color-btn w-5 h-5 md:w-6 md:h-6 rounded-full bg-teal-200 border-2 border-transparent" data-color="#99f6e4"></button>
        </div>

        <input id="brushSize" type="range" min="3" max="15" value="6" class="w-16 md:w-20 accent-cyan-400">

        <button id="spawnBtn" class="flex-1 py-2 md:py-2.5 px-3 md:px-4 bg-gradient-to-r from-teal-400 to-cyan-500 hover:from-teal-300 hover:to-cyan-400 text-slate-950 font-black rounded-xl text-[11px] md:text-xs shadow-lg transition-all duration-200 flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-paper-plane"></i> 放流する
        </button>
      </div>
    </div>
  </footer>

  <script>
    // --- Web Audio API 音響エンジン ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
        this.initialized = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }

        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        if (this.initialized) return;

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.3;

        const convolver = this.ctx.createConvolver();
        const rate = this.ctx.sampleRate;
        const length = rate * 2.5;
        const impulse = this.ctx.createBuffer(2, length, rate);
        for (let i = 0; i < 2; i++) {
          const channel = impulse.getChannelData(i);
          for (let j = 0; j < length; j++) {
            channel[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / length, 2.0);
          }
        }
        convolver.buffer = impulse;

        this.masterGain.connect(convolver);
        convolver.connect(this.ctx.destination);
        this.masterGain.connect(this.ctx.destination);
        this.initialized = true;
      }

      setScale(type) {
        if (type === 'pentatonic') {
          this.scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
        } else if (type === 'lydian') {
          this.scale = [261.63, 293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25];
        } else if (type === 'okinawa') {
          this.scale = [261.63, 329.63, 349.23, 392.00, 493.88, 523.25, 659.25, 698.46, 783.99, 987.77];
        }
      }

      playImpactSound(size, colorHex, strokeCount) {
        if (!this.initialized || !this.ctx) return;
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        const noteIndex = Math.floor(Math.max(0, Math.min(1, 1 - (size - 15) / 70)) * (this.scale.length - 1));
        const freq = this.scale[noteIndex] || 440;
        osc.frequency.setValueAtTime(freq, now);

        const waveTypes = ['sine', 'triangle', 'sine', 'triangle'];
        const typeIdx = Math.abs(this.hashCode(colorHex)) % waveTypes.length;
        osc.type = waveTypes[typeIdx];

        const attack = 0.01 + Math.min(strokeCount * 0.01, 0.05);
        const decay = 0.3 + (size / 50) * 0.4;

        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.4, now + attack);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + attack + decay);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + attack + decay + 0.1);
      }

      playBubblePopSound(radius) {
        if (!this.initialized || !this.ctx) return;
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        const startFreq = 400 + (30 - Math.min(radius, 25)) * 30;
        const endFreq = startFreq + 300;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.04);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.06);
      }

      hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) hash = (hash << 5) - hash + str.charCodeAt(i);
        return hash;
      }
    }

    const sound = new SoundEngine();

    // --- メインアプリ ---
    const aquariumCanvas = document.getElementById('aquariumCanvas');
    const ctx = aquariumCanvas.getContext('2d');

    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas.getContext('2d');

    const creatureCountEl = document.getElementById('creatureCount');
    const zoomLevelEl = document.getElementById('zoomLevel');
    const bubbleCountEl = document.getElementById('bubbleCount');

    let creatures = [];
    let bubbles = [];
    let particles = [];

    // 16:9 基準ワールド寸法
    const BASE_WORLD_WIDTH = 1920;
    const BASE_WORLD_HEIGHT = 1080;
    let worldWidth = BASE_WORLD_WIDTH;
    let worldHeight = BASE_WORLD_HEIGHT;

    let targetCameraZoom = 1.0;
    let currentCameraZoom = 1.0;

    let isDrawing = false;
    let currentStrokes = [];
    let currentPath = [];
    let currentColor = '#22d3ee';
    let currentBrushSize = 6;

    function transformToOceanGlow(hexColor) {
      const colorMap = {
        '#22d3ee': { inner: '#67e8f9', outer: 'rgba(34, 211, 238, 0.75)' },
        '#34d399': { inner: '#6ee7b7', outer: 'rgba(52, 211, 153, 0.75)' },
        '#818cf8': { inner: '#a5b4fc', outer: 'rgba(129, 140, 248, 0.75)' },
        '#c084fc': { inner: '#e9d5ff', outer: 'rgba(192, 132, 252, 0.75)' },
        '#99f6e4': { inner: '#ccfbf1', outer: 'rgba(153, 246, 228, 0.85)' }
      };
      return colorMap[hexColor] || { inner: '#ffffff', outer: 'rgba(255, 255, 255, 0.8)' };
    }

    // 16:9 画角維持レスポンシブサイズ決定
    function resize() {
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const targetAspect = 16 / 9;
      const windowAspect = winW / winH;

      if (windowAspect > targetAspect) {
        aquariumCanvas.height = winH;
        aquariumCanvas.width = winH * targetAspect;
      } else {
        aquariumCanvas.width = winW;
        aquariumCanvas.height = winW / targetAspect;
      }

      const rect = drawCanvas.getBoundingClientRect();
      drawCanvas.width = rect.width;
      drawCanvas.height = rect.height;
      redrawUserCanvas();
    }
    window.addEventListener('resize', resize);

    // --- スマホ・タッチ座標の補正計算 ---
    function getCanvasPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      // マウスイベントかタッチイベントかを自動判定
      const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // --- お絵描き機能（スマホ・タッチ対応補正） ---
    function initDrawCanvas() {
      const rect = drawCanvas.getBoundingClientRect();
      drawCanvas.width = rect.width;
      drawCanvas.height = rect.height;

      const startDraw = (e) => {
        isDrawing = true;
        document.getElementById('drawPlaceholder').style.display = 'none';
        const pt = getCanvasPos(e);
        currentPath = [pt];
      };

      const moveDraw = (e) => {
        if (!isDrawing) return;
        const pt = getCanvasPos(e);
        currentPath.push(pt);
        redrawUserCanvas();
        drawCurrentPath();
      };

      const endDraw = () => {
        if (isDrawing) {
          isDrawing = false;
          if (currentPath.length > 1) currentStrokes.push(currentPath);
          currentPath = [];
          redrawUserCanvas();
        }
      };

      // マウス操作
      drawCanvas.addEventListener('mousedown', startDraw);
      drawCanvas.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', endDraw);

      // スマホ・タッチ操作（iOS/Androidのタッチ誤動作防止処理付き）
      drawCanvas.addEventListener('touchstart', (e) => {
        if (e.cancelable) e.preventDefault();
        startDraw(e);
      }, { passive: false });

      drawCanvas.addEventListener('touchmove', (e) => {
        if (e.cancelable) e.preventDefault();
        moveDraw(e);
      }, { passive: false });

      window.addEventListener('touchend', endDraw);
      window.addEventListener('touchcancel', endDraw);
    }

    function redrawUserCanvas() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      currentStrokes.forEach(stroke => drawStroke(stroke, currentColor, currentBrushSize));
    }

    function drawCurrentPath() {
      if (currentPath.length < 2) return;
      drawStroke(currentPath, currentColor, currentBrushSize);
    }

    function drawStroke(path, color, size) {
      drawCtx.save();
      drawCtx.strokeStyle = color;
      drawCtx.lineWidth = size;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.shadowColor = color;
      drawCtx.shadowBlur = 8;

      drawCtx.beginPath();
      drawCtx.moveTo(path[0].x, path[0].y);
      for (let i = 1; i < path.length; i++) drawCtx.lineTo(path[i].x, path[i].y);
      drawCtx.stroke();
      drawCtx.restore();
    }

    document.getElementById('clearDrawBtn').addEventListener('click', () => {
      currentStrokes = [];
      currentPath = [];
      redrawUserCanvas();
      document.getElementById('drawPlaceholder').style.display = 'flex';
    });

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('border-white', 'scale-110'));
        e.target.classList.add('border-white', 'scale-110');
        currentColor = e.target.dataset.color;
        redrawUserCanvas();
      });
    });

    document.getElementById('brushSize').addEventListener('input', (e) => {
      currentBrushSize = e.target.value;
    });

    // --- 生き物クラス ---
    class Creature {
      constructor(strokes, rawColor) {
        this.strokes = strokes;
        this.rawColor = rawColor;
        this.style = transformToOceanGlow(rawColor);

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        let totalPts = 0, sumX = 0, sumY = 0;

        strokes.forEach(stroke => {
          stroke.forEach(pt => {
            if (pt.x < minX) minX = pt.x;
            if (pt.x > maxX) maxX = pt.x;
            if (pt.y < minY) minY = pt.y;
            if (pt.y > maxY) maxY = pt.y;
            sumX += pt.x; sumY += pt.y;
            totalPts++;
          });
        });

        this.width = Math.max(20, maxX - minX);
        this.height = Math.max(20, maxY - minY);
        this.radius = Math.max(15, Math.hypot(this.width, this.height) / 2);

        const localCenterX = sumX / totalPts;
        const localCenterY = sumY / totalPts;

        this.normalizedStrokes = strokes.map(stroke => 
          stroke.map(pt => ({ x: pt.x - localCenterX, y: pt.y - localCenterY }))
        );

        this.x = (Math.random() - 0.5) * (worldWidth * 0.7);
        this.y = (Math.random() - 0.5) * (worldHeight * 0.7);

        const speed = 0.8 + Math.random() * 1.2;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.strokeCount = strokes.length;
        this.phase = Math.random() * Math.PI * 2;
        this.mass = this.radius;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.phase += 0.03;

        const halfW = worldWidth / 2;
        const halfH = worldHeight / 2;

        let hit = false;
        if (this.x - this.radius < -halfW) { this.x = -halfW + this.radius; this.vx *= -1; hit = true; }
        if (this.x + this.radius > halfW) { this.x = halfW - this.radius; this.vx *= -1; hit = true; }
        if (this.y - this.radius < -halfH) { this.y = -halfH + this.radius; this.vy *= -1; hit = true; }
        if (this.y + this.radius > halfH) { this.y = halfH - this.radius; this.vy *= -1; hit = true; }

        if (hit) {
          sound.playImpactSound(this.radius, this.rawColor, this.strokeCount);
          createImpactSparks(this.x, this.y, this.style.inner);
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        const scaleX = 1 + Math.sin(this.phase) * 0.05;
        const scaleY = 1 + Math.cos(this.phase) * 0.05;
        ctx.scale(scaleX, scaleY);

        ctx.shadowColor = this.style.outer;
        ctx.shadowBlur = 20;

        this.normalizedStrokes.forEach(stroke => {
          if (stroke.length < 2) return;
          
          ctx.beginPath();
          ctx.strokeStyle = this.style.outer;
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.moveTo(stroke[0].x, stroke[0].y);
          for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
          ctx.stroke();

          ctx.beginPath();
          ctx.strokeStyle = this.style.inner;
          ctx.lineWidth = 3;
          ctx.moveTo(stroke[0].x, stroke[0].y);
          for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
          ctx.stroke();
        });

        ctx.restore();
      }
    }

    // デフォルトの初期生き物アセット
    function initDefaultCreatures() {
      const jellyfishStrokes = [
        [{x: 50, y: 50}, {x: 40, y: 30}, {x: 60, y: 20}, {x: 90, y: 20}, {x: 110, y: 30}, {x: 100, y: 50}, {x: 50, y: 50}],
        [{x: 55, y: 50}, {x: 55, y: 80}],
        [{x: 75, y: 50}, {x: 75, y: 85}],
        [{x: 95, y: 50}, {x: 95, y: 80}]
      ];
      const fishStrokes = [
        [{x: 40, y: 50}, {x: 70, y: 30}, {x: 110, y: 50}, {x: 70, y: 70}, {x: 40, y: 50}],
        [{x: 110, y: 50}, {x: 130, y: 35}, {x: 130, y: 65}, {x: 110, y: 50}],
        [{x: 80, y: 45}, {x: 80, y: 46}]
      ];
      const mantaStrokes = [
        [{x: 30, y: 50}, {x: 70, y: 20}, {x: 110, y: 50}, {x: 70, y: 80}, {x: 30, y: 50}],
        [{x: 30, y: 50}, {x: 10, y: 50}]
      ];

      creatures.push(new Creature(jellyfishStrokes, '#22d3ee'));
      creatures.push(new Creature(fishStrokes, '#818cf8'));
      creatures.push(new Creature(mantaStrokes, '#34d399'));
      updateAquariumScale();
    }

    // --- 泡クラス ---
    class Bubble {
      constructor() {
        this.radius = 6 + Math.random() * 16;
        this.x = (Math.random() - 0.5) * (worldWidth * 0.9);
        this.y = worldHeight / 2 + this.radius + 20;
        this.vy = - (0.8 + Math.random() * 1.5);
        this.swingAmplitude = 0.5 + Math.random() * 1.5;
        this.swingSpeed = 0.02 + Math.random() * 0.03;
        this.phase = Math.random() * Math.PI * 2;
        this.popped = false;
      }

      update() {
        this.phase += this.swingSpeed;
        this.x += Math.sin(this.phase) * this.swingAmplitude;
        this.y += this.vy;

        if (this.y < -worldHeight / 2) this.pop();
      }

      pop() {
        if (this.popped) return;
        this.popped = true;
        sound.playBubblePopSound(this.radius);
        createImpactSparks(this.x, this.y, '#67e8f9', 8);
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        const grad = ctx.createRadialGradient(-this.radius * 0.3, -this.radius * 0.3, 1, 0, 0, this.radius);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
        grad.addColorStop(0.4, 'rgba(165, 243, 252, 0.3)');
        grad.addColorStop(1, 'rgba(34, 211, 238, 0.1)');

        ctx.beginPath();
        ctx.fillStyle = grad;
        ctx.strokeStyle = 'rgba(165, 243, 252, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.arc(-this.radius * 0.4, -this.radius * 0.4, this.radius * 0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function createImpactSparks(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          color: color, life: 1.0, decay: 0.02 + Math.random() * 0.03, size: 2 + Math.random() * 3
        });
      }
    }

    function spawnCreatureFromData(strokesData, colorData) {
      if (!strokesData || strokesData.length === 0) return;
      const newCreature = new Creature(strokesData, colorData);
      creatures.push(newCreature);
      updateAquariumScale();
      sound.playImpactSound(newCreature.radius, colorData, newCreature.strokeCount);
    }

    document.getElementById('spawnBtn').addEventListener('click', () => {
      if (currentStrokes.length === 0) return;

      spawnCreatureFromData(currentStrokes, currentColor);

      currentStrokes = [];
      redrawUserCanvas();
      document.getElementById('drawPlaceholder').style.display = 'flex';
    });

    function updateAquariumScale() {
      creatureCountEl.textContent = creatures.length;
      
      targetCameraZoom = Math.max(0.4, 1.0 / (1 + Math.max(0, creatures.length - 3) * 0.06));
      worldWidth = BASE_WORLD_WIDTH / targetCameraZoom;
      worldHeight = BASE_WORLD_HEIGHT / targetCameraZoom;

      zoomLevelEl.textContent = `${Math.round(targetCameraZoom * 100)}%`;
    }

    setInterval(() => {
      if (bubbles.length < 25) bubbles.push(new Bubble());
    }, 1200);

    function handleCollisions() {
      for (let i = 0; i < creatures.length; i++) {
        for (let j = i + 1; j < creatures.length; j++) {
          const c1 = creatures[i];
          const c2 = creatures[j];
          const dx = c2.x - c1.x;
          const dy = c2.y - c1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = c1.radius + c2.radius;

          if (dist < minDist) {
            const overlap = minDist - dist;
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);

            c1.x -= nx * overlap * 0.5;
            c1.y -= ny * overlap * 0.5;
            c2.x += nx * overlap * 0.5;
            c2.y += ny * overlap * 0.5;

            const kx = c1.vx - c2.vx;
            const ky = c1.vy - c2.vy;
            const p = 2 * (nx * kx + ny * ky) / (c1.mass + c2.mass);

            c1.vx -= p * c2.mass * nx;
            c1.vy -= p * c2.mass * ny;
            c2.vx += p * c1.mass * nx;
            c2.vy += p * c1.mass * ny;

            sound.playImpactSound((c1.radius + c2.radius) / 2, c1.rawColor, c1.strokeCount);
            createImpactSparks((c1.x + c2.x) / 2, (c1.y + c2.y) / 2, c1.style.inner, 6);
          }
        }
      }

      for (let b of bubbles) {
        for (let c of creatures) {
          if (Math.hypot(b.x - c.x, b.y - c.y) < b.radius + c.radius) {
            b.pop();
            break;
          }
        }
      }
    }

    // --- レンダリングループ ---
    function render() {
      currentCameraZoom += (targetCameraZoom - currentCameraZoom) * 0.05;

      ctx.save();
      ctx.clearRect(0, 0, aquariumCanvas.width, aquariumCanvas.height);

      const w = aquariumCanvas.width;
      const h = aquariumCanvas.height;

      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, '#06152d');
      bgGrad.addColorStop(0.4, '#030e20');
      bgGrad.addColorStop(1, '#020611');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const rayGrad = ctx.createRadialGradient(w / 2, -100, 50, w / 2, h * 0.8, w * 0.8);
      rayGrad.addColorStop(0, 'rgba(56, 189, 248, 0.25)');
      rayGrad.addColorStop(0.5, 'rgba(20, 184, 166, 0.08)');
      rayGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = rayGrad;
      ctx.fillRect(0, 0, w, h);
      ctx.restore();

      ctx.save();
      ctx.translate(w / 2, h / 2);

      const viewScale = (w / BASE_WORLD_WIDTH) * currentCameraZoom;
      ctx.scale(viewScale, viewScale);

      ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
      ctx.lineWidth = 3;
      ctx.strokeRect(-worldWidth / 2, -worldHeight / 2, worldWidth, worldHeight);

      handleCollisions();

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.update();
        b.draw(ctx);
        if (b.popped) bubbles.splice(i, 1);
      }
      bubbleCountEl.textContent = bubbles.length;

      creatures.forEach(c => {
        c.update();
        c.draw(ctx);
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }

        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
      ctx.restore();

      requestAnimationFrame(render);
    }

    // --- 音声有効化＆モーダル解除の確実な処理 ---
    const modal = document.getElementById('audioStartModal');
    const startBtn = document.getElementById('startAudioBtn');

    function dismissModal(e) {
      if (e) e.preventDefault();
      sound.init();
      modal.remove();
    }

    startBtn.addEventListener('click', dismissModal);
    startBtn.addEventListener('touchend', dismissModal);
    modal.addEventListener('click', dismissModal);

    const scaleBtns = { 'scalePentatonic': 'pentatonic', 'scaleLydian': 'lydian', 'scaleOkinawa': 'okinawa' };
    Object.keys(scaleBtns).forEach(id => {
      document.getElementById(id).addEventListener('click', (e) => {
        Object.keys(scaleBtns).forEach(bId => {
          document.getElementById(bId).className = "flex-1 md:flex-none px-2.5 py-1.5 rounded-lg text-[10px] md:text-xs bg-slate-800/60 border border-slate-700 text-slate-400 font-medium hover:bg-slate-700/50";
        });
        e.target.className = "flex-1 md:flex-none px-2.5 py-1.5 rounded-lg text-[10px] md:text-xs bg-cyan-500/30 border border-cyan-400 text-cyan-100 font-medium";
        sound.setScale(scaleBtns[id]);
      });
    });

    // --- お絵描き専用サブウィンドウ機能 ---
    document.getElementById('openPopoutBtn').addEventListener('click', () => {
      const popout = window.open('', 'SoundAquariumCanvas', 'width=450,height=600');
      if (!popout) {
        alert('ポップアップがブロックされました。ブラウザのポップアップ許可を設定してください。');
        return;
      }

      popout.document.write(`
        <!DOCTYPE html>
        <html lang="ja">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>お絵描きパレット - 深海音響水槽</title>
          <script src="https://cdn.tailwindcss.com"><\/script>
          <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
          <style>
            body { font-family: sans-serif; user-select: none; background: #030712; color: #f8fafc; margin: 0; overflow: hidden; touch-action: none; }
            #subCanvas { cursor: crosshair; touch-action: none; }
          </style>
        </head>
        <body class="p-4 flex flex-col h-screen justify-between">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-bold text-cyan-300 flex items-center gap-1">
              <i class="fa-solid fa-pen-nib"></i> 生き物を描く
            </span>
            <button id="subClear" class="text-xs text-slate-400 hover:text-rose-400">
              <i class="fa-solid fa-trash-can"></i> クリア
            </button>
          </div>

          <div class="relative flex-1 bg-slate-900 rounded-2xl border border-cyan-500/30 overflow-hidden mb-3">
            <canvas id="subCanvas" class="w-full h-full block"></canvas>
            <div id="subPlaceholder" class="absolute inset-0 flex items-center justify-center pointer-events-none text-slate-500 text-xs">
              ここに自由に描いて放流してください
            </div>
          </div>

          <div class="flex items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-1 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
              <button class="sub-color w-6 h-6 rounded-full bg-cyan-400 border-2 border-white" data-color="#22d3ee"></button>
              <button class="sub-color w-6 h-6 rounded-full bg-emerald-400 border-2 border-transparent" data-color="#34d399"></button>
              <button class="sub-color w-6 h-6 rounded-full bg-indigo-400 border-2 border-transparent" data-color="#818cf8"></button>
              <button class="sub-color w-6 h-6 rounded-full bg-purple-400 border-2 border-transparent" data-color="#c084fc"></button>
              <button class="sub-color w-6 h-6 rounded-full bg-teal-200 border-2 border-transparent" data-color="#99f6e4"></button>
            </div>
            <input id="subBrush" type="range" min="3" max="15" value="6" class="w-20 accent-cyan-400">
          </div>

          <button id="subSpawn" class="w-full py-3 bg-gradient-to-r from-teal-400 to-cyan-500 text-slate-950 font-black rounded-xl text-sm shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> 水槽へ放流する
          </button>

          <script>
            const canvas = document.getElementById('subCanvas');
            const ctx = canvas.getContext('2d');
            let isDrawing = false;
            let strokes = [];
            let currentPath = [];
            let color = '#22d3ee';
            let size = 6;

            function resize() {
              const rect = canvas.getBoundingClientRect();
              canvas.width = rect.width;
              canvas.height = rect.height;
              redraw();
            }
            window.addEventListener('resize', resize);
            setTimeout(resize, 100);

            function redraw() {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              strokes.forEach(s => drawStroke(s, color, size));
            }

            function drawStroke(path, c, s) {
              if (path.length < 2) return;
              ctx.save();
              ctx.strokeStyle = c;
              ctx.lineWidth = s;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.shadowColor = c;
              ctx.shadowBlur = 8;
              ctx.beginPath();
              ctx.moveTo(path[0].x, path[0].y);
              for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
              ctx.stroke();
              ctx.restore();
            }

            const getPos = e => {
              const r = canvas.getBoundingClientRect();
              const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
              const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
              return { x: clientX - r.left, y: clientY - r.top };
            };

            canvas.addEventListener('mousedown', e => {
              isDrawing = true;
              document.getElementById('subPlaceholder').style.display = 'none';
              currentPath = [getPos(e)];
            });

            canvas.addEventListener('mousemove', e => {
              if (!isDrawing) return;
              currentPath.push(getPos(e));
              redraw();
              drawStroke(currentPath, color, size);
            });

            window.addEventListener('mouseup', () => {
              if (isDrawing) {
                isDrawing = false;
                if (currentPath.length > 1) strokes.push(currentPath);
                currentPath = [];
                redraw();
              }
            });

            canvas.addEventListener('touchstart', e => {
              if (e.cancelable) e.preventDefault();
              isDrawing = true;
              document.getElementById('subPlaceholder').style.display = 'none';
              currentPath = [getPos(e)];
            }, { passive: false });

            canvas.addEventListener('touchmove', e => {
              if (!isDrawing) return;
              if (e.cancelable) e.preventDefault();
              currentPath.push(getPos(e));
              redraw();
              drawStroke(currentPath, color, size);
            }, { passive: false });

            window.addEventListener('touchend', () => {
              if (isDrawing) {
                isDrawing = false;
                if (currentPath.length > 1) strokes.push(currentPath);
                currentPath = [];
                redraw();
              }
            });

            document.getElementById('subClear').addEventListener('click', () => {
              strokes = [];
              currentPath = [];
              redraw();
              document.getElementById('subPlaceholder').style.display = 'flex';
            });

            document.querySelectorAll('.sub-color').forEach(btn => {
              btn.addEventListener('click', e => {
                document.querySelectorAll('.sub-color').forEach(b => b.classList.remove('border-white'));
                e.target.classList.add('border-white');
                color = e.target.dataset.color;
                redraw();
              });
            });

            document.getElementById('subBrush').addEventListener('input', e => { size = e.target.value; });

            document.getElementById('subSpawn').addEventListener('click', () => {
              if (strokes.length === 0) return;
              if (window.opener && !window.opener.closed) {
                window.opener.postMessage({ type: 'SPAWN_CREATURE', strokes: strokes, color: color }, '*');
                strokes = [];
                currentPath = [];
                redraw();
                document.getElementById('subPlaceholder').style.display = 'flex';
              }
            });
          <\/script>
        </body>
        </html>
      `);
      popout.document.close();
    });

    // サブウィンドウからの放流メッセージを受信
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'SPAWN_CREATURE') {
        spawnCreatureFromData(event.data.strokes, event.data.color);
      }
    });

    window.addEventListener('load', () => {
      resize();
      initDrawCanvas();
      initDefaultCreatures();
      requestAnimationFrame(render);
    });
  </script>
</body>
</html>
